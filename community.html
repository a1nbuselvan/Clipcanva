<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070708" />
    <meta
      name="description"
      content="Discover Clipcanva creators and canvases they've chosen to publish."
    />
    <title>Discover — Clipcanva</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="community.css" />
    <script src="supabase-config.js"></script>
    <script type="module" src="community.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="auth.html"><span>C</span> Clipcanva</a>
      <a class="back" href="index.html">Open workspace</a>
    </header>
    <main>
      <section class="intro">
        <p class="eyebrow">CLIPCANVA COMMUNITY</p>
        <h1 id="page-title">Discover creators</h1>
        <p id="page-description">
          Find people and explore the canvases they chose to share.
        </p>
      </section>
      <form id="search-form" role="search">
        <label class="sr" for="search">Search public usernames</label>
        <input
          id="search"
          name="q"
          type="search"
          placeholder="Search by username"
          maxlength="24"
          autocomplete="off"
        />
        <button type="submit">Search</button>
      </form>
      <p class="privacy">
        Profiles show only a public username and display name. Email addresses
        and private canvases are never shown.
      </p>
      <section id="profile-panel" class="profile-panel" hidden>
        <div id="profile-social" class="profile-social"></div>
        <section class="activity-panel" aria-label="Profile activity">
          <div class="activity-heading">
            <h2>Activity</h2>
            <span id="activity-total"></span>
          </div>
          <div id="activity-graph"></div>
        </section>
        <div id="relations" class="relations" hidden></div>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <section
        id="results"
        class="results"
        aria-label="Creators and published canvases"
      ></section>
    </main>
  </body>
</html>
